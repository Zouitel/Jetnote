name: Firebase Functions

on:
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions.yml"
  push:
    branches: [master]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions.yml"
  workflow_dispatch:

jobs:
  test:
    name: Build and test AI proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build

      - name: Run rate-limit tests
        run: npm test
