# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow builds the Android project with Gradle.

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      ANDROID_CMAKE_VERSION: 3.22.1
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK command-line tools
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Install and verify Android NDK and CMake
      shell: bash
      run: |
        set -euo pipefail

        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        if [ -z "$sdk_root" ]; then
          echo "Android SDK root was not configured."
          exit 1
        fi

        sdkmanager_bin="$(command -v sdkmanager || true)"
        if [ -z "$sdkmanager_bin" ]; then
          echo "sdkmanager was not found on PATH."
          exit 1
        fi

        ndk_dir="$sdk_root/ndk/$ANDROID_NDK_VERSION"
        installed=false
        for attempt in 1 2 3; do
          echo "Installing Android NDK $ANDROID_NDK_VERSION (attempt $attempt/3)"
          # Remove any partial installation left by a failed or interrupted download.
          rm -rf "$ndk_dir"
          if "$sdkmanager_bin" --install "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION" &&
             [ -s "$ndk_dir/source.properties" ] &&
             grep -q "Pkg.Revision = $ANDROID_NDK_VERSION" "$ndk_dir/source.properties"; then
            installed=true
            break
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "NDK installation was incomplete; retrying."
            sleep $((attempt * 15))
          fi
        done

        if [ "$installed" != true ]; then
          echo "Could not install a valid Android NDK $ANDROID_NDK_VERSION after 3 attempts."
          exit 1
        fi

        echo "Verified NDK installation:"
        grep "Pkg.Revision" "$ndk_dir/source.properties"
        "$sdkmanager_bin" --list_installed | grep -E "ndk;$ANDROID_NDK_VERSION|cmake;$ANDROID_CMAKE_VERSION"

    # Configure Gradle for optimal use in GitHub Actions, including dependency caching.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Download Gradle distribution (with retries)
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if ./gradlew --version; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Gradle distribution download failed (attempt $attempt/3); retrying..."
            sleep $((attempt * 15))
          fi
        done
        echo "Gradle distribution could not be downloaded after 3 attempts."
        exit 1

    - name: Build with Gradle Wrapper (retry transient Maven failures)
      shell: bash
      run: |
        set -o pipefail
        for attempt in 1 2 3; do
          if ./gradlew build --stacktrace; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Gradle build failed (attempt $attempt/3); retrying in case of a transient repository download failure..."
            sleep $((attempt * 20))
          fi
        done
        echo "Gradle build failed after 3 attempts."
        exit 1
