# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # Use the registered Ubuntu x64 Android runner instead of GitHub-hosted minutes.
    runs-on: [self-hosted, linux, x64, android]
    # Do not execute fork-controlled code on a personal self-hosted machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Download Gradle distribution (with retries)
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if ./gradlew --version; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Gradle distribution download failed (attempt $attempt/3); retrying..."
            sleep $((attempt * 15))
          fi
        done
        echo "Gradle distribution could not be downloaded after 3 attempts."
        exit 1

    - name: Build with Gradle Wrapper
      run: ./gradlew build

