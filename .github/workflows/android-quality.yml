name: Android quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-screenshot-baselines:
    name: Record feedback screenshot baselines
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Record screenshots
        run: ./gradlew :feedback:testDebugUnitTest -Proborazzi.test.record=true
      - uses: actions/upload-artifact@v4
        with:
          name: feedback-screenshots
          path: feedback/build/outputs/roborazzi
          if-no-files-found: error
          retention-days: 30

  screenshot-tests:
    name: Compose screenshot regression tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Download latest master screenshot baselines
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: android-quality.yml
          branch: master
          name: feedback-screenshots
          path: feedback/build/outputs/roborazzi
          github_token: ${{ secrets.GITHUB_TOKEN }}
          if_no_artifact_found: warn
      - name: Bootstrap baselines on the first run
        run: |
          if [ -z "$(find feedback/build/outputs/roborazzi -type f -name '*.png' -print -quit 2>/dev/null)" ]; then
            ./gradlew :feedback:testDebugUnitTest -Proborazzi.test.record=true
          fi
      - name: Verify screenshot baselines
        run: ./gradlew :feedback:testDebugUnitTest -Proborazzi.test.verify=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-screenshot-diffs
          path: feedback/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 14

  macrobenchmarks:
    name: Startup and scroll benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run Macrobenchmark and Baseline Profile instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -euo pipefail

            # The runner normally waits for boot, but ADB can briefly leave a
            # cold-booted emulator in the offline state. Reconnect and verify
            # both transport readiness and Android's completed-boot property.
            SERIAL="${ANDROID_SERIAL:-emulator-5554}"
            adb devices -l
            adb reconnect offline || true

            READY=false
            for attempt in $(seq 1 90); do
              STATE="$(adb -s "$SERIAL" get-state 2>/dev/null || true)"
              if [ "$STATE" = "device" ]; then
                BOOT_COMPLETED="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                if [ "$BOOT_COMPLETED" = "1" ]; then
                  READY=true
                  break
                fi
              fi
              echo "Waiting for $SERIAL (state=$STATE, boot_completed=${BOOT_COMPLETED:-unknown})"
              sleep 5
            done

            if [ "$READY" != "true" ]; then
              echo "Emulator did not become ready. Final ADB diagnostics:"
              adb devices -l
              adb -s "$SERIAL" get-state || true
              adb -s "$SERIAL" shell getprop sys.boot_completed || true
              exit 1
            fi

            adb -s "$SERIAL" shell settings put global window_animation_scale 0
            adb -s "$SERIAL" shell settings put global transition_animation_scale 0
            adb -s "$SERIAL" shell settings put global animator_duration_scale 0

            ./gradlew :app:generateBaselineProfile -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile :benchmark:connectedCheck
