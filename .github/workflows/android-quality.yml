name: Android quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-screenshot-baselines:
    name: Record feedback screenshot baselines
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Record screenshots
        run: ./gradlew :feedback:recordRoborazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: feedback-screenshots
          path: feedback/build/outputs/roborazzi
          if-no-files-found: error
          retention-days: 30

  screenshot-tests:
    name: Compose screenshot regression tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Download latest master screenshot baselines
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: android-quality.yml
          branch: master
          name: feedback-screenshots
          path: feedback/build/outputs/roborazzi
          github_token: ${{ secrets.GITHUB_TOKEN }}
          if_no_artifact_found: warn
      - name: Bootstrap baselines on the first run
        run: |
          if [ -z "$(find feedback/build/outputs/roborazzi -type f -name '*.png' -print -quit 2>/dev/null)" ]; then
            ./gradlew :feedback:recordRoborazziDebug
          fi
      - name: Verify screenshot baselines
        run: ./gradlew :feedback:verifyRoborazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-screenshot-diffs
          path: feedback/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 14

  macrobenchmarks:
    name: Startup and scroll benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Macrobenchmark and Baseline Profile instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: ./gradlew :app:generateBaselineProfile :benchmark:connectedCheck
